            margin-bottom: 0.5rem;
        }

        .theme-toggle {
            font-size: 1.5rem;
            color: var(--text);
            background: none;
            border: none;
            cursor: pointer;
            padding: 0.5rem;
            border-radius: 50%;
            transition: background-color var(--transition-speed);
        }

        .theme-toggle:hover {
            background-color: rgba(128, 128, 128, 0.2);
        }

        #console {

        }

        #a {

            font-size: 16px;
            /* Adjust as needed */

            /* Adjust for better readability */

            /* Add horizontal scroll if needed */
            background-color: #0b0a0a;
            /* Optional: Background color for contrast */
            padding: 10px;
            /* Optional: Padding for aesthetics */
            border-radius: 5px;
            /* Optional: Rounded corners */
        }

        /* Responsive adjustments */
        @media (max-width: 600px) {
            .ascii-art {
                font-size: 14px;

        }

        @media (max-width: 768px) {
            body {

                font-size: 14px;
            }

            h1 {
                font-size: 1.25rem;
            }

            .ascii-art {
                font-size: 0.6rem;
            }
        }

        @media (max-width: 480px) {
            body {

                font-size: 12px;
            }

            h1 {
                font-size: 1rem;
            }

            .ascii-art {
                font-size: 0.4rem;

        }
    </style>
